description: >-
  Three system prompts I actually run: a landing-page brief generator that
  refuses to default to the same aesthetic, a niche-and-offer strategist that
  scores ideas instead of cheering them on, and a validation generator built to
  kill bad ideas in a week.
order: 2
groups:
  # Items come from the `prompts` collection; each is a Markdown file with its
  # own page. Adding one means adding src/content/prompts/<name>.md.
  - kind: docs
    title: prompts/
    meta: open to read, copy to use
    collection: prompts
    copyDocument: true
